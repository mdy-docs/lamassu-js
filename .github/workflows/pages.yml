name: Deploy playground + docs to GitHub Pages

# Builds the engine to WebAssembly (Emscripten) and then the VitePress site,
# which is the whole deployment: guide, API reference, security notes, and the
# REPL playground as a page of it. The playground used to be a separate Vite
# app served at the root with the docs nested under /docs/; it is one build
# now, so the guides and the thing they describe can link to each other.
#
# docs-site/.vitepress/config.mts sets `base` to /lamassu-js/ to match the
# project-site path. Enable Pages in repo Settings → Pages with
# "Source: GitHub Actions" for this to deploy.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer run cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules — the regex engine lives in third_party)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify toolchain
        run: emcc --version && node --version

      - name: Build the WebAssembly package (packages/lamassu-js/dist)
        run: make pkg

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the site (docs + playground)
        run: npm run build:docs

      - name: Sanity-check the artifacts exist
        run: |
          # The playground page and the engine it loads are the two things most
          # likely to go missing without failing the build: the .wasm is pulled
          # in through a `?url` import, so a resolution change would silently
          # produce a page that loads nothing.
          test -f docs-site/dist/index.html
          test -f docs-site/dist/playground.html
          test -f docs-site/dist/guide/index.html
          test -f docs-site/dist/api/index.html
          ls docs-site/dist/assets/*.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
